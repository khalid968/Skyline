name: skyline-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skyline
      POSTGRES_PASSWORD: skyline
      POSTGRES_DB: skyline
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyline -d skyline"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # RELEASE.2025-09-07T16-13-09Z, built from source (minio/Dockerfile checks
    # the commit): MinIO images can no longer be pulled anonymously, so this is
    # how a fresh machine and CI get the same MinIO. The first `up` builds it
    # (a few minutes). The production store is chosen at Deployment.
    build: ./minio
    image: skyline-minio:2025-09-07
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: skyline
      MINIO_ROOT_PASSWORD: skyline-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  coturn:
    # The call relay (Phase 10). Every call goes through it, so neither person
    # learns the other's IP address; it only ever forwards encrypted packets.
    # Credentials are short-lived and signed by the Skyline server with the
    # shared secret (use-auth-secret). Pinned by digest to coturn 4.6.3.
    image: coturn/coturn@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-dev-only-turn-secret}
      - --realm=skyline.local
      - --no-cli
      - --no-tls
      - --no-dtls
      - --min-port=49160
      - --max-port=49200
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"

volumes:
  postgres-data:
  redis-data:
  minio-data:
