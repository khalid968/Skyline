# Skyline in production: one server, Docker Compose (locked decision).
# Operator guide: docs/deployment/. Settings: a `.env` file next to this one
# (copy production.env.example; never commit it).
#
# Public ports: 80 and 443 (Nginx), 3478 udp/tcp plus the relay
# range 49160-49200 udp (coturn, host networking). Postgres, Redis, MinIO and
# the API are reachable only inside the stack.
name: skyline

x-images: &images
  backend: &backend-image ${SKYLINE_REGISTRY:-skyline}/backend:${SKYLINE_VERSION:-local}

services:
  web:
    image: ${SKYLINE_REGISTRY:-skyline}/web:${SKYLINE_VERSION:-local}
    build:
      context: ../..
      dockerfile: infra/production/web/Dockerfile
    restart: unless-stopped
    environment:
      SKYLINE_DOMAIN: ${SKYLINE_DOMAIN:?set SKYLINE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      - releases:/srv/releases:ro
    depends_on:
      backend:
        condition: service_healthy

  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    profiles: ["letsencrypt"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Obtain once, then try renewing twice a day (Nginx picks it up itself).
    # The email is optional: Let's Encrypt no longer sends expiry mail, so
    # without one nobody outside learns who runs the server.
    environment:
      ADMIN_EMAIL: ${SKYLINE_ADMIN_EMAIL:-}
    entrypoint: >
      sh -c 'trap exit TERM;
             if [ -n "$$ADMIN_EMAIL" ]; then who="--email $$ADMIN_EMAIL --no-eff-email"; else who=--register-unsafely-without-email; fi;
             certbot certonly --webroot -w /var/www/certbot -d ${SKYLINE_DOMAIN} $$who --agree-tos --non-interactive --keep-until-expiring;
             while :; do sleep 12h & wait $${!}; certbot renew --webroot -w /var/www/certbot --quiet; done'

  backend:
    image: *backend-image
    build:
      context: ../../apps/backend
      args:
        GIT_SHA: ${SKYLINE_GIT_SHA:-unknown}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-log}
      # The API's own role: owns nothing (postgres/10-app-role.sh).
      DATABASE_URL: postgres://skyline_app:${SKYLINE_APP_DB_PASSWORD:?}@postgres:5432/skyline
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      STORAGE_ENDPOINT: minio
      STORAGE_PORT: 9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      STORAGE_BUCKET: skyline-media
      AUTH_TOKEN_PEPPER: ${AUTH_TOKEN_PEPPER:?}
      AUTH_TOTP_KEY: ${AUTH_TOTP_KEY:?}
      TURN_SECRET: ${TURN_SECRET:?}
      TURN_URLS: turn:${SKYLINE_DOMAIN}:3478?transport=udp,turn:${SKYLINE_DOMAIN}:3478?transport=tcp
      TRUST_PROXY: "1"
      APP_MIN_VERSION: ${APP_MIN_VERSION:-0.0.0}
      APP_RELEASES_FILE: /srv/releases/manifest.json
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
    volumes:
      - releases:/srv/releases:ro
      - ./secrets:/run/skyline-secrets:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  # One-shot: brings the schema up to date with the OWNER role. deploy.sh
  # runs it before starting a new backend.
  migrate:
    image: *backend-image
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://skyline:${POSTGRES_PASSWORD:?}@postgres:5432/skyline
    entrypoint: ["node", "node_modules/node-pg-migrate/bin/node-pg-migrate.js", "up", "-m", "dist/database/migrations", "-j", "sql"]
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skyline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: skyline
      SKYLINE_APP_DB_PASSWORD: ${SKYLINE_APP_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyline -d skyline"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Rate limits, fan-out and presence only; nothing to persist.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

  minio:
    image: ${SKYLINE_REGISTRY:-skyline}/minio:2025-09-07
    build:
      context: ../docker/minio
    restart: unless-stopped
    command: ["server", "/data"]   # no console in production
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_BROWSER: "off"
    volumes:
      - minio-data:/data

  coturn:
    # The same pinned coturn as development. Host networking: relay
    # addresses are the server's public address, so private ranges can be
    # denied outright (threat model A1: the relay can never reach inside).
    image: coturn/coturn@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888
    restart: unless-stopped
    network_mode: host
    # TURN over TLS (5349) is not enabled yet: certbot's key is root-only
    # and coturn runs unprivileged (known-risks.md). UDP and TCP on 3478
    # cover most networks.
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --no-tls
      - --no-dtls
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?}
      - --realm=${SKYLINE_DOMAIN}
      - --no-cli
      - --min-port=49160
      - --max-port=49200
      - --no-multicast-peers
      - --no-loopback-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

  backup:
    build:
      context: ./backup
    image: ${SKYLINE_REGISTRY:-skyline}/backup:${SKYLINE_VERSION:-local}
    restart: unless-stopped
    environment:
      POSTGRES_USER: skyline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: skyline
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?set the owner's age public key}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
    volumes:
      - backups:/backups
      - minio-data:/media-data
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres-data:
  minio-data:
  backups:
  releases:
  letsencrypt:
  certbot-www:
