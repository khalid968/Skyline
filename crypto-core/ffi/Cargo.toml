[package]
name = "skyline_crypto_ffi"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "flutter_rust_bridge surface of skyline_crypto_core. Translation only; no logic."

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
skyline_crypto_core = { path = "../core" }
flutter_rust_bridge = "=2.13.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
