[package]
name = "skyline_e2e"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "Development check: two real crypto-core devices against a running Skyline backend."

[[bin]]
name = "skyline-e2e"
path = "src/main.rs"

[dependencies]
skyline_crypto_core = { path = "../core" }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
base64 = "0.22"
