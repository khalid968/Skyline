name: skyline
description: "Skyline — secure messaging, built for people you trust."
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Models / codegen
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local encrypted storage (wired up in Phase 4/5)
  drift: ^2.19.0
  sqlite3_flutter_libs: ^0.5.24
  flutter_secure_storage: ^9.2.2

  cupertino_icons: ^1.0.8
  flutter_rust_bridge: 2.13.0
  skyline_crypto_ffi:
    path: rust_builder
  path_provider: ^2.1.5
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  flutter_svg: ^2.3.0
  qr_flutter: ^4.1.0
  uuid: ^4.6.0
  local_auth: ^3.0.1
  flutter_zxing: 2.2.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^20.1.0
  file_picker: ^11.0.3
  image_picker: ^1.2.2
  record: ^6.2.1
  audioplayers: ^6.7.1
  video_player: ^2.10.1
  video_player_win: ^3.3.0
  image: ^4.10.1
  open_filex: ^4.7.0
  fc_native_video_thumbnail: ^2.2.0
  gal: ^2.3.3
  video_compress: ^3.1.4
  emoji_picker_flutter: ^4.4.0
  flutter_webrtc: ^1.6.2+hotfix.3
  url_launcher: ^6.3.2
  crypto: ^3.0.7
  # Phase 14c: the phone's own ringing screen (Android full-screen call,
  # iPhone CallKit). Pinned exactly: it runs when Skyline is closed.
  flutter_callkit_incoming: 3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.19.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # iOS builds with CocoaPods (ios/Podfile), as CI does. Newer Flutter turns
  # on Swift Package Manager, which fails to resolve Firebase's dependencies.
  config:
    enable-swift-package-manager: false

  # Bundled, never fetched at runtime: a font download would tell a third
  # party every time someone opens Skyline. SIL Open Font License; the
  # licence texts ship in assets/fonts.
  assets:
    - assets/fonts/OFL-spacegrotesk.txt
    - assets/fonts/OFL-plusjakartasans.txt
    - assets/fonts/OFL-jetbrainsmono.txt
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/space-grotesk-500.ttf
          weight: 500
        - asset: assets/fonts/space-grotesk-700.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus-jakarta-sans-400.ttf
          weight: 400
        - asset: assets/fonts/plus-jakarta-sans-500.ttf
          weight: 500
        - asset: assets/fonts/plus-jakarta-sans-600.ttf
          weight: 600
        - asset: assets/fonts/plus-jakarta-sans-700.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains-mono-400.ttf
          weight: 400
        - asset: assets/fonts/jetbrains-mono-500.ttf
          weight: 500
