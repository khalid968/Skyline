include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # cargokit's build tool is its own package, run by the native build.
    - rust_builder/**
    # Generated by flutter_rust_bridge_codegen; regenerate, never edit.
    - lib/src/rust/**

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_print: true
